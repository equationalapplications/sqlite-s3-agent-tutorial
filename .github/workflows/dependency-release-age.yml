name: Dependency release age

# Policy: a PR's package-lock.json delta vs the base branch must contain no
# registry version published in the last 14 days, to limit exposure to
# poisoned upstream releases. A PR whose delta is empty (no new or changed
# packages) passes without a cooldown; whole-lockfile sweeps stay available
# as manual `workflow_dispatch` audits. Runs before any install, so a
# too-new package's install scripts never execute in CI.
on:
  pull_request:
    paths-ignore:
      - '**/package-lock.json'
      - 'scripts/check-release-age.mjs'
      - '.github/workflows/dependency-release-age.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history so the base branch ref is present for the delta
          # diff; the checkout action's own fetch is authenticated during
          # the step, and `git show` afterwards needs no credentials.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"
      - name: Check minimum release age
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set -e
          found_lock=0
          while IFS= read -r lock; do
            found_lock=1
            echo "::group::$lock"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              node scripts/check-release-age.mjs --days 14 --base "$BASE_REF" --lockfile "$lock"
            else
              node scripts/check-release-age.mjs --days 14 --lockfile "$lock"
            fi
            echo "::endgroup::"
          done < <(find . -name package-lock.json -not -path '*/node_modules/*')
          if [ "$found_lock" = "0" ]; then
            echo "No package-lock.json found; nothing to age-check."
          fi
